<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071F2A">
<meta name="description" content="Mtaa Pulse: stories from your neighbourhood, verified at the source.">
<title>Mtaa Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071F2A;
  --trust:#0B4F6C;
  --signal:#1E88A8;
  --sky:#E8F4FA;
  --muted:#9FC3D2;
  --body:#CFE4EE;
  --accent:#F2A33C;
  --danger:#FF9B8A;
  --nav-h:76px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#02080C}
body{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--sky);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--ink)}

/* ---------- feed ---------- */
.feed{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;will-change:scroll-position;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;overflow:hidden;contain:layout paint style;scroll-snap-align:start;scroll-snap-stop:always}
.scene{position:absolute;inset:0}
.scene svg,.scene video{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene video{object-fit:cover}
.slide-body{position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px;padding:0 14px 8px}
.info{flex:1;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{padding:4px 10px;border-radius:999px;font-size:12px}
.tag-mood{background:var(--accent);color:var(--ink);font-weight:700}
.tag-cat{background:rgba(232,244,250,.16);color:var(--sky);font-weight:500}
.caption{margin:0;font-size:15px;line-height:1.3;font-weight:700;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.caption.open{display:block}
.more{position:relative;display:flex;align-items:center;min-height:30px;font-size:13px;font-weight:700;color:var(--accent)}
.more::after{content:'';position:absolute;inset:-8px -14px}
.more[hidden]{display:none}
.chips{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chiprow{display:flex;align-items:center;gap:8px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:999px;background:rgba(7,31,42,.62);border:1px solid rgba(232,244,250,.28);font-size:12px;font-weight:500;color:var(--sky)}
.chip svg{stroke:var(--accent)}
.chip.verified{font-weight:700}
.muted{color:var(--muted)}
.poster{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--sky)}
.av{width:20px;height:20px;border-radius:50%;object-fit:cover;background:var(--trust)}

.rail{display:flex;flex-direction:column;align-items:center;gap:8px;width:48px;font-size:11px;color:var(--sky)}
.rail-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.round{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:rgba(232,244,250,.14);color:var(--sky)}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 32px;text-align:center}
.empty strong{font-size:22px;color:#fff}
.empty span{font-size:15px;color:var(--muted)}
.empty .btn{width:auto;padding:0 28px;margin-top:10px}

/* ---------- top ---------- */
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.brand{padding:8px 16px 0;font-size:18px;font-weight:700;letter-spacing:-.01em;color:#fff}
.brand span{color:var(--accent)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 16px 0}
.pill,.tab,.iconbtn{position:relative}
.pill::after,.tab::after,.iconbtn::after{content:'';position:absolute;inset:-6px}
.pill{display:flex;align-items:center;gap:5px;flex:0 1 auto;min-width:0;height:30px;padding:0 10px 0 8px;border-radius:15px;background:rgba(7,31,42,.62);border:1px solid rgba(232,244,250,.22);font-size:12px;font-weight:500;color:var(--sky)}
.pill svg{flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.on{border-color:var(--accent)}
.tabs{flex:1 0 auto;display:flex;justify-content:center;gap:10px}
.tab{height:30px;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-pressed="true"]{font-weight:700;color:#fff;border-bottom-color:var(--accent)}
.iconbtn{display:flex;align-items:center;justify-content:center;flex:none;width:30px;height:30px;border-radius:15px;background:rgba(7,31,42,.62);border:1px solid rgba(232,244,250,.22);color:var(--sky)}
.scope{padding:4px 16px 0;font-size:11px;color:var(--muted)}

/* ---------- bottom navigation ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-around;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 8px calc(8px + env(safe-area-inset-bottom));background:rgba(7,31,42,.95);border-top:1px solid rgba(232,244,250,.12)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:64px;height:56px;font-size:12px;font-weight:500;color:var(--muted)}
.nav-item[aria-current="page"]{font-weight:700;color:#fff}
.nav-av{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.report{display:flex;align-items:center;justify-content:center;width:64px;height:48px;border-radius:16px;background:var(--accent);color:var(--ink)}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 84px);z-index:60;transform:translateX(-50%);max-width:92%;padding:10px 18px;border-radius:999px;background:rgba(7,31,42,.94);border:1px solid rgba(232,244,250,.28);font-size:14px;font-weight:500;color:#fff;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
.toast.show{opacity:1}

/* ---------- county picker ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:none}
.sheet-wrap.open{display:block}
.scrim{position:absolute;inset:0;width:100%;height:100%;background:rgba(0,0,0,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;display:flex;flex-direction:column;padding:12px 20px calc(24px + env(safe-area-inset-bottom));background:#0B2F40;border-radius:24px 24px 0 0;border-top:1px solid rgba(232,244,250,.18)}
.grab{align-self:center;width:40px;height:4px;border-radius:2px;background:#3F6A7E}
.sheet h2{margin:16px 0 12px;font-size:22px;font-weight:700;color:#fff}
.search{height:48px;padding:0 18px;border-radius:24px;border:1px solid rgba(232,244,250,.28);background:rgba(232,244,250,.08);color:#fff;font:inherit;font-size:16px}
.search::placeholder{color:var(--muted)}
.hint{margin:12px 0 8px;font-size:14px;line-height:1.4;color:var(--muted)}
.list{margin:0;padding:0;list-style:none;overflow-y:auto}
.list button{display:flex;align-items:center;justify-content:space-between;width:100%;height:52px;border-top:1px solid rgba(232,244,250,.12);font-size:17px;font-weight:500;text-align:left;color:var(--sky)}
.list svg{stroke:var(--accent)}
.list .none{padding:16px 0;font-size:15px;color:var(--muted)}

/* ---------- full-screen panels ---------- */
.panel{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:var(--ink)}
.panel.open{display:flex}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px}
.panel-head h2{margin:0;font-size:17px;font-weight:700;color:#fff}
.hbtn{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:var(--sky)}
.hbtn[hidden]{visibility:hidden;display:flex}
.panel-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px calc(28px + env(safe-area-inset-bottom));scrollbar-width:none}
.panel-body::-webkit-scrollbar{display:none}
.h1{margin:8px 0 6px;font-size:26px;line-height:1.15;font-weight:700;color:#fff;letter-spacing:-.01em}
.lede{margin:0 0 20px;font-size:15px;line-height:1.45;color:var(--body)}
.stack{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;flex-direction:column;gap:4px;width:100%;padding:16px;border-radius:18px;text-align:left;background:rgba(232,244,250,.07);border:1px solid rgba(232,244,250,.2)}
.choice strong{font-size:17px;color:#fff}
.choice span{font-size:14px;line-height:1.35;color:var(--body)}
.choice.main{border-color:var(--accent);background:rgba(242,163,60,.1)}
.choice:hover{border-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;background:var(--accent);color:var(--ink);font-size:16px;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--sky);border:1px solid rgba(232,244,250,.28);font-weight:500}
.linkbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:14px;font-weight:700;color:var(--accent)}
.linkbtn[disabled]{color:var(--muted);cursor:default}
.center{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px}
.center .muted{font-size:14px}
.divider{margin:18px 0 6px;padding-top:14px;border-top:1px solid rgba(232,244,250,.14)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:14px;border-radius:24px;background:rgba(232,244,250,.08)}
.seg button{height:40px;border-radius:20px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--trust);color:#fff;font-weight:700}
.label{display:block;margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
.gap{height:14px}
.field{display:flex;align-items:center;height:52px;border-radius:14px;border:1px solid rgba(232,244,250,.28);background:rgba(232,244,250,.08);overflow:hidden}
.field:focus-within{border-color:var(--accent)}
.field .pre{padding:0 0 0 14px;font-size:16px;font-weight:500;color:var(--muted)}
.field input{flex:1;min-width:0;height:100%;padding:0 14px;background:transparent;border:0;color:#fff;font:inherit;font-size:16px}
.field input::placeholder{color:#6F98A9}
.field input:focus-visible{outline:none}
.field .tgl{flex:none;height:100%;padding:0 14px;font-size:13px;font-weight:700;color:var(--accent)}
.err{min-height:20px;margin:8px 0 12px;font-size:14px;line-height:1.35;color:var(--danger)}
.note{margin:12px 0 0;font-size:13px;line-height:1.4;color:var(--muted)}
.demo{margin:0 0 14px;padding:10px 12px;border-radius:12px;background:rgba(242,163,60,.14);border:1px dashed var(--accent);font-size:13px;color:var(--sky)}
.otp{width:100%;height:60px;border-radius:14px;border:1px solid rgba(232,244,250,.28);background:rgba(232,244,250,.08);color:#fff;font:inherit;font-size:30px;font-weight:700;letter-spacing:.5em;text-align:center;padding-left:.5em}
.otp:focus-visible{outline:none;border-color:var(--accent)}
.avwrap{display:flex;align-items:center;gap:16px;margin:4px 0 18px}
.avbtn{position:relative;flex:none;width:92px;height:92px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(232,244,250,.08);border:2px dashed rgba(232,244,250,.35);color:var(--muted)}
.avbtn img{width:100%;height:100%;object-fit:cover;display:block}
.avmeta{font-size:14px;line-height:1.4;color:var(--body)}
.avmeta b{color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* report form */
.vidbox{position:relative;aspect-ratio:9/12;max-height:300px;width:100%;border-radius:18px;overflow:hidden;background:rgba(232,244,250,.07);border:1px dashed rgba(232,244,250,.3);display:flex;align-items:center;justify-content:center}
.vidbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.vidrow{display:flex;gap:10px;margin-top:10px}
.vidrow .btn{height:46px;font-size:15px}
.sec{margin:20px 0 8px;font-size:14px;font-weight:700;color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(232,244,250,.28);background:rgba(232,244,250,.07);font-size:14px;font-weight:500;color:var(--sky)}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
textarea.ta{width:100%;min-height:96px;padding:12px 14px;border-radius:14px;border:1px solid rgba(232,244,250,.28);background:rgba(232,244,250,.08);color:#fff;font:inherit;font-size:16px;line-height:1.4;resize:vertical}
textarea.ta:focus-visible{outline:none;border-color:var(--accent)}
.counter{margin-top:4px;text-align:right;font-size:12px;color:var(--muted)}
.where{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:var(--body)}
.where svg{flex:none;stroke:var(--accent)}
.who{padding:12px 14px;border-radius:14px;background:rgba(232,244,250,.07);font-size:14px;line-height:1.4;color:var(--body)}
.who b{color:#fff}
.prog{height:8px;border-radius:4px;background:rgba(232,244,250,.14);overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}
.prog[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .toast,.prog i{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app">

  <main class="feed" id="feed" aria-label="Stories"></main>

  <header class="top">
    <div class="brand">Mtaa <span>Pulse</span></div>
    <div class="bar">
      <button class="pill" id="countyBtn" type="button" aria-haspopup="dialog" aria-label="Choose county">
        <span data-icon="pin" data-size="14"></span><span id="countyName"></span>
      </button>
      <div class="tabs">
        <button class="tab" id="tabNearby" type="button" aria-pressed="true">Nearby</button>
        <button class="tab" id="tabKenya" type="button" aria-pressed="false">All Kenya</button>
      </div>
      <button class="iconbtn" id="searchBtn" type="button" aria-label="Search" data-icon="search" data-size="16"></button>
    </div>
    <div class="scope" id="scopeLabel"></div>
  </header>

  <nav class="nav" aria-label="Main">
    <button class="nav-item" id="homeBtn" type="button" aria-current="page"><span data-icon="home"></span>Home</button>
    <button class="nav-item" id="mapBtn" type="button"><span data-icon="map"></span>Map</button>
    <button class="report" id="reportBtn" type="button" aria-label="Report" data-icon="plus" data-size="28" data-stroke="2.5"></button>
    <button class="nav-item" id="savedBtn" type="button"><span data-icon="bookmark"></span>Saved</button>
    <button class="nav-item" id="loginBtn" type="button"><span id="loginIcon" data-icon="user"></span><span id="loginLabel">Log in</span></button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- county picker -->
  <div class="sheet-wrap" id="sheet">
    <button class="scrim" id="scrim" type="button" aria-label="Close county picker"></button>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grab"></div>
      <h2 id="sheetTitle">Choose a county</h2>
      <input class="search" id="countySearch" type="text" placeholder="Type a county name" aria-label="Type a county name" autocomplete="off">
      <p class="hint">You will see stories from that county only. Choose Nearby to include areas around it.</p>
      <ul class="list" id="countyList"></ul>
    </div>
  </div>

  <!-- sign up / log in panel (rendered step by step) -->
  <section class="panel" id="authPanel" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="panel-head">
      <button class="hbtn" id="authBack" type="button" aria-label="Back" data-icon="back" data-size="24"></button>
      <h2 id="authTitle">Welcome</h2>
      <button class="hbtn" id="authClose" type="button" aria-label="Close" data-icon="close" data-size="24"></button>
    </div>
    <div class="panel-body" id="authBody"></div>
  </section>

  <!-- report panel -->
  <section class="panel" id="reportPanel" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="panel-head">
      <span class="hbtn" aria-hidden="true"></span>
      <h2 id="reportTitle">New story</h2>
      <button class="hbtn" id="reportClose" type="button" aria-label="Close" data-icon="close" data-size="24"></button>
    </div>
    <div class="panel-body" id="reportBody"></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  /* ==================================================================
     1. CONFIG
     Every limit lives here so it can be tuned (or served from your
     server) without touching the logic below.
     ================================================================== */
  var CONFIG = {
    DEMO: true,                 // true = fake backend, OTP shown on screen. Set false when your real backend is connected.
    OTP_LENGTH: 6,
    OTP_RESEND_SEC: 30,
    ANON_TOKEN_MS: 15 * 60 * 1000,          // a verified anonymous poster has 15 minutes to post, one story per verification
    PASSWORD_MIN: 8,
    PASSWORD_MAX: 72,
    USERNAME_RE: /^[a-z0-9_]{3,20}$/,
    // Feed paging
    PAGE_SIZE: 8,
    PREFETCH_AHEAD: 3,                      // fetch the next page when the viewer is this many stories from the end
    // Profile picture
    AVATAR_MAX_INPUT: 15 * 1024 * 1024,
    AVATAR_TARGET_BYTES: 30 * 1024,
    AVATAR_SIZES: [320, 256, 192, 128],
    AVATAR_QUALITIES: [0.86, 0.78, 0.70, 0.60, 0.50],
    // Story video (the server transcodes it, see notes in the API section)
    VIDEO_MAX_SEC: 60,
    VIDEO_MAX_BYTES: 50 * 1024 * 1024,
    CAPTION_MIN: 10,
    CAPTION_MAX: 280
  };

  var MOODS = ['Hooray!', 'Relief!', 'Proud!', 'Hopeful!', 'Worried!', 'Frustrated!'];
  var CATEGORIES = ['Roads and bridges', 'Water', 'Farms', 'Health', 'Schools', 'Security', 'Power', 'Markets', 'Environment', 'Other'];

  /* ==================================================================
     2. API LAYER
     The screens only ever call `api`. Below is a working fake so every
     flow can be tried. To go live, replace each function body with a
     request, keep the return shapes, and set CONFIG.DEMO = false.

     Endpoints (all JSON, all behind your CDN/WAF):
       POST /v1/otp/request     { channel, contact, purpose }         -> { ok }                    429 + Retry-After when limited
       POST /v1/otp/verify      { channel, contact, code, purpose }   -> { token, exists? }
       POST /v1/auth/login      { contact, password }                 -> { token, profile }
       POST /v1/auth/reset      { token, contact, password }          -> { ok }
       GET  /v1/usernames/:name                                       -> { available }
       POST /v1/accounts        { token, contact, username, password, avatarUrl } -> { token, profile }
       POST /v1/uploads         { kind, type, size }                  -> { uploadUrl, objectKey, publicUrl, headers }
       PUT  <uploadUrl>         (bytes straight to object storage)
       POST /v1/stories         { idempotencyKey, token, anonymous, ..., videoKey } -> { story }
       GET  /v1/stories?scope=&county=&cursor=&limit=                 -> { items, nextCursor }

     Rules the server must follow for 10M users:
       - Phone numbers and emails are salted-hashed before storage or lookup,
         and never returned to other people.
       - OTP requests are rate limited per contact AND per IP (and per device),
         with a short lock after repeated wrong codes. Reply 429 + Retry-After.
       - Passwords use argon2id or bcrypt. Login attempts are rate limited.
       - Videos and photos go browser -> object storage (presigned URL) -> CDN.
         Your servers only see small JSON. Use resumable uploads (tus or S3
         multipart) for video on weak networks.
       - Video is transcoded on the server after upload (HLS/MP4 ladder, short
         thumbnails) by a queue worker. The story shows "Being checked" until
         transcoding and review finish. Do not re-encode on the phone.
       - Anonymous posts: the verification token is single use and expires in
         minutes. When the story is created, burn the token and keep nothing
         that links the post to the email or number. Keep only a short-lived
         salted hash for rate limiting, then discard it.
       - Feed uses cursor paging (opaque cursor, never page numbers/offsets in
         production), cached per county at the edge.
     ================================================================== */
  function apiErr(code, msg, retryAfter) { var e = new Error(msg); e.code = code; e.retryAfter = retryAfter || 0; return e; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* ----- fake data for the demo backend ----- */
  var TEMPLATES = [
    { mood: 'Hooray!', category: 'Roads and bridges', scene: 'bridge', caption: 'Children can now cross to school even when the river is full. Work finished last week.' },
    { mood: 'Relief!', category: 'Water', scene: 'tower', caption: 'The borehole near the market is pumping again after the repair. Queues are much shorter this morning.' },
    { mood: 'Proud!', category: 'Farms', scene: 'terraces', caption: 'Soil now stays on the slope after heavy rain. Beans and maize look strong this season. The terraces were built together over two weekends.' }
  ];
  var PLACES = [
    { county: 'Kisii County', ward: 'Nyanchwa Ward' }, { county: 'Nyamira County', ward: 'Township Ward' },
    { county: 'Nyeri County', ward: 'Mweiga Ward' }, { county: 'Migori County', ward: 'Suna East Ward' },
    { county: 'Kericho County', ward: 'Kapsoit Ward' }
  ];
  var WHENS = ['2 days ago', '5 hours ago', '1 day ago', '3 days ago', '40 minutes ago'];

  /* ==================================================================
     4. PROFILE PICTURE COMPRESSION (in the browser)
     Centre-crop to a square, halve down in steps so it stays sharp,
     save as WebP (JPEG where WebP is missing), trying lower quality and
     size until it is 30 KB or less. Only the small file is uploaded.
     ================================================================== */

    try { return document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0; } catch (e) { return false; }
  })();

    return new Promise(function (res, rej) {

    var sx = (imgW(img) - side) / 2, sy = (imgH(img) - side) / 2, src = img, sw = side;
    while (sw / 2 >= size) {

  async function compressAvatar(file) {
    if (!file || !/^image\//.test(file.type)) throw new Error('Please choose a photo (JPG, PNG or WebP).');
    if (file.size > CONFIG.AVATAR_MAX_INPUT) throw new Error('That photo is too big. Choose one under ' + fmtBytes(CONFIG.AVATAR_MAX_INPUT) + '.');
    var img;
    try { img = await decodeImage(file); } catch (e) { throw new Error('We could not read that photo. Try another one.'); }
    var type = webpOk ? 'image/webp' : 'image/jpeg', best = null;
    for (var i = 0; i < CONFIG.AVATAR_SIZES.length; i++) {
      var canvas = drawSquare(img, CONFIG.AVATAR_SIZES[i]);
      for (var j = 0; j < CONFIG.AVATAR_QUALITIES.length; j++) {
        var blob = await toBlob(canvas, type, CONFIG.AVATAR_QUALITIES[j]);
        if (!blob) continue;
        if (!best || blob.size < best.size) best = blob;
        if (blob.size <= CONFIG.AVATAR_TARGET_BYTES) {

  function teardownObservers() {
    if (playObs) playObs.disconnect();
    if (loadObs) loadObs.disconnect();
    playObs = loadObs = null;
  }
  function ensureObservers() {
    if (playObs || !('IntersectionObserver' in window)) return;
    playObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var v = e.target.querySelector('video');
        if (!v) return;
        if (e.isIntersecting) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        else { v.pause(); v.currentTime = 0; }
      });
    }, { root: feed, threshold: 0.6 });
    loadObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var v = e.target.querySelector('video');
        if (!v) return;
        if (e.isIntersecting) { if (!v.getAttribute('src')) v.setAttribute('src', v.dataset.src); }
        else if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.load(); }
      });
    }, { root: feed, rootMargin: '100% 0px 100% 0px' });
  }
  function observeSlides(nodes) {
    ensureObservers();
    nodes.forEach(function (n) {
      var v = n.querySelector('video');

      else v.setAttribute('src', v.dataset.src);
    });

  function resetFeed() {
    stopGlide();
    fs.gen++; fs.items = []; fs.seen = {}; fs.cursor = null; fs.done = false; fs.loading = false;

    feed.scrollTop = 0;

  function loadPage() {
    if (fs.loading || fs.done) return;
    fs.loading = true;
    var gen = fs.gen;
    api.listStories({ scope: state.scope, county: state.county, cursor: fs.cursor, limit: CONFIG.PAGE_SIZE }).then(function (r) {
      if (gen !== fs.gen) return;
      fs.loading = false;
      var first = fs.items.length === 0;
      var fresh = r.items.filter(function (s) { if (fs.seen[s.id]) return false; fs.seen[s.id] = 1; return true; });
      var start = fs.items.length;
      fs.items = fs.items.concat(fresh);
      fs.cursor = r.nextCursor;
      fs.done = !r.nextCursor;
      if (first && !fresh.length) { feed.innerHTML = emptyHtml(); return; }
      var html = fresh.map(function (s, k) { return slideHtml(s, start + k); }).join('');
      if (first) feed.innerHTML = html; else feed.insertAdjacentHTML('beforeend', html);
      var added = Array.prototype.slice.call(feed.querySelectorAll('.slide'), start);
      updateMoreButtons(added);
      observeSlides(added);
      maybeLoadMore();
    }).catch(function () {
      if (gen !== fs.gen) return;
      fs.loading = false;
      if (!fs.items.length) feed.innerHTML = failHtml(); else toast('Could not load more stories');
    });
  }

  /* ---------- smooth one-video-at-a-time scrolling ---------- */
  var animRaf = 0, wheelLock = false, lastWheel = 0;
  function slideSize() { return feed.clientHeight || 1; }
  function currentIndex() { return Math.round(feed.scrollTop / slideSize()); }
  function stopGlide() { if (animRaf) { cancelAnimationFrame(animRaf); animRaf = 0; feed.style.scrollSnapType = ''; } }
  function animateTo(target) {
    stopGlide();
    var start = feed.scrollTop, delta = target - start;
    if (Math.abs(delta) < 1) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { feed.scrollTop = target; return; }
    var duration = Math.min(700, 380 + (Math.abs(delta) / slideSize()) * 70), t0 = null;
    feed.style.scrollSnapType = 'none';
    function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / duration);
      var eased = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      feed.scrollTop = start + delta * eased;
      if (p < 1) animRaf = requestAnimationFrame(step);
      else { animRaf = 0; feed.style.scrollSnapType = ''; }
    }
    animRaf = requestAnimationFrame(step);
  }
  function goToIndex(i) {
    var count = feed.querySelectorAll('.slide').length;
    animateTo(Math.max(0, Math.min(count - 1, i)) * slideSize());
  }

    wheelLock = true;
    goToIndex(currentIndex() + (e.deltaY > 0 ? 1 : -1));
    (function release() { setTimeout(function () { if (Date.now() - lastWheel < 140) release(); else wheelLock = false; }, 720); })();

    if (t.id === 'otp') {
      t.value = t.value.replace(/\D/g, '').slice(0, CONFIG.OTP_LENGTH);
      $('authGo').disabled = t.value.length !== CONFIG.OTP_LENGTH;
      setErr('');
      if (t.value.length === CONFIG.OTP_LENGTH) verifyCode();
    } else if (t.id === 'uname') {
      t.value = t.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
      flow.username = t.value; setErr('');
    } else if (t.id === 'pw') { flow.password = t.value; setErr(''); }
    else if (t.id === 'contact') { flow.rawContact = t.value; setErr(''); }
  });
  authBody.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !/^(contact|uname|pw)$/.test(e.target.id)) return;
    var go = $('authGo');
    if (go && !go.disabled) { e.preventDefault(); go.click(); }
  });
  authBody.addEventListener('change', function (e) {
    if (e.target.id === 'avFile' && e.target.files && e.target.files[0]) pickAvatar(e.target.files[0]);
  });

  function readContact() {
    var raw = ($('contact') && $('contact').value) || flow.rawContact || '';
    return flow.channel === 'email' ? normalizeEmail(raw) : normalizePhone(raw);
  }
  var CONTACT_ERR = { email: 'Enter a valid email address.', phone: 'Enter a valid Kenyan number, like 0712 345 678.' };

  function sendCode(isResend) {
    var c = isResend ? flow.contact : readContact();
    if (!c) { setErr(CONTACT_ERR[flow.channel]); return; }
    flow.contact = c;
    if (!isResend) setBusy(true, 'Sending…'); else flow.busy = true;
    api.requestOtp(flow.channel, c, flow.mode).then(function (r) {
      flow.busy = false;
      flow.demoCode = r.demoCode;
      showStep('otp');
      if (isResend) toast('New code sent');
    }).catch(function (err) {
      flow.busy = false;
      if (isResend) { setErr(errMsg(err)); var rb = $('resend'); if (rb) rb.disabled = true; }
      else { setBusy(false); setErr(errMsg(err)); }
    });
  }

  function verifyCode() {
    var input = $('otp'), code = input ? input.value : '';
    if (code.length !== CONFIG.OTP_LENGTH || flow.busy) return;
    setBusy(true, 'Checking…');
    api.verifyOtp(flow.channel, flow.contact, code, flow.mode).then(function (r) {
      flow.busy = false;
      if (flow.mode === 'anon') {
        /* Nothing is saved: no account, no stored contact. The token is held in memory for one post. */
        flow.contact = ''; flow.rawContact = '';
        session = { type: 'anon', token: r.token, exp: Date.now() + CONFIG.ANON_TOKEN_MS };
        updateLoginButton();
        finishAuth('You are verified. Post your story anonymously.');
      } else if (r.exists) {
        flow.mode = 'login';
        showStep('login', { clearTrail: true });
        toast('You already have an account. Log in with your password.', 3200);
      } else {
        flow.verifyToken = r.token;
        showStep(flow.mode === 'reset' ? 'newpass' : 'profile', { noPush: false });
      }
    }).catch(function (err) {
      flow.busy = false; setBusy(false);
      setErr(errMsg(err));
      if (input) { input.value = ''; input.focus(); $('authGo').disabled = true; }
    });
  }

  function validPassword(p) {
    if (p.length < CONFIG.PASSWORD_MIN) return 'Your password needs at least ' + CONFIG.PASSWORD_MIN + ' characters.';
    return '';
  }

  function doLogin() {
    var c = readContact(), pw = ($('pw') || {}).value || '';
    if (!c) { setErr(CONTACT_ERR[flow.channel]); return; }
    if (!pw) { setErr('Enter your password.'); return; }
    setBusy(true, 'Logging in…');
    api.login(flow.channel, c, pw).then(function (r) {
      flow.busy = false;
      setSession({ type: 'account', token: r.token, username: r.profile.username, avatar: r.profile.avatar, contactMask: maskContact(flow.channel, c) });
      finishAuth('Welcome back, @' + r.profile.username);
    }).catch(function (err) {
      flow.busy = false; setBusy(false);
      // Same message for "no such account" and "wrong password" so nobody can probe which contacts are registered.
      setErr(err.code === 'bad_credentials' ? 'That email or number and password do not match. You can reset your password or create an account below.' : errMsg(err));
    });
  }

  function savePassword() {
    var msg = validPassword(flow.password);
    if (msg) { setErr(msg); return; }
    setBusy(true, 'Saving…');
    api.resetPassword(flow.verifyToken, flow.contact, flow.password).then(function () {
      flow.busy = false;
      flow.mode = 'login'; flow.password = ''; flow.verifyToken = null;
      showStep('login', { clearTrail: true });
      toast('Password changed. Log in with the new one.', 3000);
    }).catch(function (err) { flow.busy = false; setBusy(false); setErr(errMsg(err)); });
  }

  function pickAvatar(file) {
    var meta = $('avMeta');
    flow.compressing = true;
    if (meta) meta.innerHTML = avatarMetaHtml();
    setErr('');
    compressAvatar(file).then(function (res) {
      if (!flow) return;
      if (flow.avatar && flow.avatar.url) URL.revokeObjectURL(flow.avatar.url);
      res.url = URL.createObjectURL(res.blob);
      flow.avatar = res; flow.compressing = false;
      renderProfile(); hydrateIcons(authBody);
    }).catch(function (err) {
      if (!flow) return;
      flow.compressing = false;
      if (meta) meta.innerHTML = avatarMetaHtml();
      setErr(err.message);
    });
  }

  /* Upload the small avatar straight to storage, never through our own servers. */
  function uploadAvatar(blob) {
    return api.getUploadTarget('avatar', { type: blob.type, size: blob.size }).then(function (t) {
      return api.putObject(t, blob, function () {}).then(function () {
        return CONFIG.DEMO ? blobToDataUrl(blob) : t.publicUrl;
      });
    });
  }

  function createAccount() {
    var name = (flow.username || '').toLowerCase();
    if (!CONFIG.USERNAME_RE.test(name)) { setErr('Username must be 3 to 20 characters: letters, numbers or underscore.'); return; }
    var pm = validPassword(flow.password);
    if (pm) { setErr(pm); return; }
    setBusy(true, 'Creating…');
    api.checkUsername(name).then(function (r) {
      if (!r.available) throw apiErr('taken', 'That username is taken. Try another.');
      return flow.avatar ? uploadAvatar(flow.avatar.blob) : null;
    }).then(function (avatarUrl) {
      return api.createAccount({ token: flow.verifyToken, contact: flow.contact, username: name, password: flow.password, avatarUrl: avatarUrl }).then(function (r) {
        flow.busy = false;
        setSession({ type: 'account', token: r.token, username: name, avatar: avatarUrl, contactMask: maskContact(flow.channel, flow.contact) });
        finishAuth('Account created. Welcome, @' + name);
      });
    }).catch(function (err) { flow.busy = false; setBusy(false); setErr(errMsg(err)); });
  }

  function finishAuth(msg) {
    var after = flow && flow.after;
    closeAuth();
    toast(msg);
    if (after === 'report') openReport();
  }

  /* ---------- nav: Log in / Me ---------- */
  function updateLoginButton() {
    var label = $('loginLabel'), ic = $('loginIcon');
    if (session && session.type === 'account') {
      label.textContent = 'Me';
      ic.innerHTML = session.avatar ? '<img class="nav-av" src="' + esc(session.avatar) + '" alt="">' : icon('user', 26);
    } else {
      label.textContent = 'Log in';
      ic.innerHTML = icon('user', 26);
    }
  }
  $('loginBtn').addEventListener('click', function () {
    if (session && session.type === 'account') {
      lastFocus = document.activeElement;
      flow = newFlow('login'); authPanel.classList.add('open'); showStep('account');
    } else openAuth('login', null, 'login');
  });

  /* ==================================================================
     10. REPORTING
     Needs either an account login or a fresh anonymous verification.
     The + button goes to account creation, where anonymous is offered.
     The ward is read from the phone's location. The video goes straight
     to object storage, then the story is created with its storage key.
     ================================================================== */
  var reportPanel = $('reportPanel'), reportBody = $('reportBody'), rep = null;

  function newReport() {
    return { file: null, url: null, dur: 0, mood: null, category: null, caption: '', ward: null, county: null, locState: 'idle', uploading: false, key: uuid() };
  }
  function openReport() {
    if (!hasValidSession()) { openAuth('choose', 'report'); return; }
    lastFocus = document.activeElement;
    rep = newReport();
    renderReport();
    reportPanel.classList.add('open');
    detectWard();
  }
  function closeReport() {
    if (rep && rep.uploading) { toast('Please wait, your story is uploading'); return; }
    if (rep && rep.url) URL.revokeObjectURL(rep.url);
    reportPanel.classList.remove('open');
    rep = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function renderReport() {
    var anon = session.type !== 'account';
    reportBody.innerHTML =
      '<div class="vidbox" id="vidBox">' + videoBoxHtml() + '</div>' +
      '<p class="note" id="vidInfo">' + videoInfoText() + '</p>' +
      '<div class="vidrow">' +
        '<button class="btn" type="button" data-r="record">' + icon('video', 20) + 'Record</button>' +
        '<button class="btn ghost" type="button" data-r="upload">' + icon('upload', 20) + 'Choose</button>' +
      '</div>' +
      '<input class="sr" id="vidRec" type="file" accept="video/*" capture="environment" tabindex="-1">' +
      '<input class="sr" id="vidPick" type="file" accept="video/*" tabindex="-1">' +
      '<div class="sec" id="moodLbl">How does it feel?</div>' +
      '<div class="opts" role="radiogroup" aria-labelledby="moodLbl">' +
        MOODS.map(function (m) { return '<button class="opt" type="button" role="radio" aria-checked="false" data-r="mood" data-v="' + esc(m) + '">' + esc(m) + '</button>'; }).join('') +
      '</div>' +
      '<div class="sec" id="catLbl">What is it about?</div>' +
      '<div class="opts" role="radiogroup" aria-labelledby="catLbl">' +
        CATEGORIES.map(function (c) { return '<button class="opt" type="button" role="radio" aria-checked="false" data-r="cat" data-v="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
      '</div>' +
      '<label class="sec" for="cap" style="display:block">Tell the story</label>' +
      '<textarea class="ta" id="cap" maxlength="' + CONFIG.CAPTION_MAX + '" placeholder="What happened, and why does it matter to your neighbours?"></textarea>' +
      '<div class="counter" id="capCount">0 / ' + CONFIG.CAPTION_MAX + '</div>' +
      '<div class="sec">Where</div><div class="where" id="where"></div>' +
      '<div class="sec">Posting as</div>' +
      '<div class="who">' + (anon
        ? '<b>Anonymous reporter</b><br>No account is created, and nothing that links this story to you is kept after you post.'
        : '<b>@' + esc(session.username) + '</b>') + '</div>' +
      '<p class="err" id="repErr" role="alert" style="margin-top:14px"></p>' +
      '<div class="prog" id="prog" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progBar"></i></div>' +
      '<button class="btn" id="repGo" type="button" data-r="post" disabled>Post story</button>' +
      '<p class="note">New stories are processed and checked before they show a Verified badge.</p>';
    renderWhere();
  }
  function videoBoxHtml() {
    if (rep.url) return '<video src="' + esc(rep.url) + '" controls muted playsinline preload="metadata"></video>';
    return '<span class="muted" style="font-size:14px;text-align:center;padding:0 24px">Record or choose a video up to ' + CONFIG.VIDEO_MAX_SEC + ' seconds</span>';
  }
  function videoInfoText() {
    if (!rep.file) return 'Up to ' + CONFIG.VIDEO_MAX_SEC + ' seconds and ' + fmtBytes(CONFIG.VIDEO_MAX_BYTES) + '. Hold your phone upright.';
    return Math.round(rep.dur) + ' seconds, ' + fmtBytes(rep.file.size);
  }
  function repErr(msg) { var el = $('repErr'); if (el) el.textContent = msg || ''; }

  function renderWhere() {
    var el = $('where');
    if (!el) return;
    if (rep.locState === 'busy') el.innerHTML = icon('pin', 18) + '<span>Finding your ward…</span>';
    else if (rep.locState === 'ok') el.innerHTML = icon('pin', 18) + '<span><b style="color:#fff">' + esc(rep.ward) + '</b>, ' + esc(rep.county) + '</span>';
    else el.innerHTML = '<div style="width:100%"><p class="note" style="margin:0 0 8px">We could not read your location. Turn on location for this site and try again.</p>' +
      '<button class="btn ghost" type="button" data-r="locate" style="height:44px">Try again</button></div>';
  }
  /* Stand-in. Real version: GET /v1/geo/ward?lat=..&lng=.. */
  function resolveWard() { return wait(500).then(function () { return { ward: 'Nyanchwa Ward', county: state.home }; }); }
  function detectWard() {
    if (!navigator.geolocation) { rep.locState = 'fail'; renderWhere(); return; }
    rep.locState = 'busy'; renderWhere();
    navigator.geolocation.getCurrentPosition(function (pos) {
      resolveWard(pos.coords.latitude, pos.coords.longitude).then(function (r) {
        if (!rep) return;
        rep.ward = r.ward; rep.county = r.county; rep.locState = 'ok'; renderWhere(); validateReport();
      });
    }, function () {
      if (!rep) return;
      rep.locState = 'fail'; renderWhere(); validateReport();
    }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
  }
  function validateReport() {
    var b = $('repGo');
    if (!b || !rep) return;
    b.disabled = !(rep.file && rep.mood && rep.category && rep.caption.trim().length >= CONFIG.CAPTION_MIN && rep.locState === 'ok') || rep.uploading;
  }

  function takeVideo(file) {
    repErr('');
    if (!file) return;
    if (!/^video\//.test(file.type)) { repErr('Please choose a video file.'); return; }
    if (file.size > CONFIG.VIDEO_MAX_BYTES) { repErr('That video is ' + fmtBytes(file.size) + '. The limit is ' + fmtBytes(CONFIG.VIDEO_MAX_BYTES) + '. Try a shorter clip.'); return; }
    var url = URL.createObjectURL(file), probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.onloadedmetadata = function () {
      var dur = probe.duration;
      if (!isFinite(dur) || dur <= 0) { URL.revokeObjectURL(url); repErr('We could not read that video. Try another one.'); return; }
      if (dur > CONFIG.VIDEO_MAX_SEC + 0.5) { URL.revokeObjectURL(url); repErr('That video is ' + Math.round(dur) + ' seconds. The limit is ' + CONFIG.VIDEO_MAX_SEC + '.'); return; }
      if (!rep) { URL.revokeObjectURL(url); return; }
      if (rep.url) URL.revokeObjectURL(rep.url);
      rep.file = file; rep.url = url; rep.dur = dur;
      $('vidBox').innerHTML = videoBoxHtml();
      $('vidInfo').textContent = videoInfoText();
      validateReport();
    };
    probe.onerror = function () { URL.revokeObjectURL(url); repErr('We could not read that video. Try another one.'); };
    probe.src = url;
  }

  reportBody.addEventListener('click', function (e) {
    var el = e.target.closest('[data-r]');
    if (!el || !rep || rep.uploading) return;
    var a = el.dataset.r;
    if (a === 'record') $('vidRec').click();
    else if (a === 'upload') $('vidPick').click();
    else if (a === 'mood' || a === 'cat') {
      el.parentNode.querySelectorAll('.opt').forEach(function (o) { o.setAttribute('aria-checked', String(o === el)); });
      rep[a === 'mood' ? 'mood' : 'category'] = el.dataset.v;
      validateReport();
    }
    else if (a === 'locate') detectWard();
    else if (a === 'post') submitReport();
  });
  reportBody.addEventListener('change', function (e) {
    if ((e.target.id === 'vidRec' || e.target.id === 'vidPick') && e.target.files[0]) { takeVideo(e.target.files[0]); e.target.value = ''; }
  });
  reportBody.addEventListener('input', function (e) {
    if (e.target.id !== 'cap' || !rep) return;
    rep.caption = e.target.value;
    $('capCount').textContent = e.target.value.length + ' / ' + CONFIG.CAPTION_MAX;
    validateReport();
  });
  $('reportClose').addEventListener('click', closeReport);

  function submitReport() {
    if (!rep || rep.uploading) return;
    if (!hasValidSession()) { repErr('Your verification expired. Close this and verify again.'); return; }
    rep.uploading = true;
    repErr('');
    var go = $('repGo'), prog = $('prog'), bar = $('progBar');
    go.disabled = true; go.textContent = 'Uploading…';
    prog.hidden = false;
    function onProgress(pct) { bar.style.width = pct + '%'; prog.setAttribute('aria-valuenow', String(Math.round(pct))); }
    var isAnon = session.type !== 'account', videoKey = null;

    api.getUploadTarget('video', { type: rep.file.type, size: rep.file.size, duration: rep.dur }).then(function (t) {
      videoKey = t.objectKey;
      return api.putObject(t, rep.file, onProgress);          // bytes go straight to storage
    }).then(function () {
      go.textContent = 'Posting…';
      return api.createStory({
        idempotencyKey: rep.key,                                // a retry cannot create a second post
        token: session.token,                                   // single use for anonymous posters
        anonymous: isAnon,
        mood: rep.mood, category: rep.category, caption: rep.caption.trim(),
        ward: rep.ward, county: rep.county, videoKey: videoKey, durationSec: Math.round(rep.dur),
        posterName: isAnon ? null : '@' + session.username,
        posterAvatar: isAnon ? null : session.avatar,
        localPreview: rep.url                                   // demo only
      });
    }).then(function (r) {
      var county = r.story.county;
      rep.uploading = false;
      rep.url = null;                                           // the feed now owns the preview
      if (isAnon) { session = null; updateLoginButton(); }      // anonymous: nothing remembered
      closeReport();
      state.scope = 'county'; state.county = county;
      updateHeader(); resetFeed();
      toast(isAnon ? 'Posted anonymously. We keep nothing that links it to you.' : 'Posted. We will check it before it is marked Verified.', 3400);
    }).catch(function (err) {
      rep.uploading = false;
      prog.hidden = true; go.textContent = 'Post story'; validateReport();
      repErr(err.code === 'rate_limited' ? errMsg(err) : (err.message || 'Upload failed.') + ' Tap Post story to try again.');
    });
  }

  $('reportBtn').addEventListener('click', openReport);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (sheet.classList.contains('open')) closeSheet();
    else if (reportPanel.classList.contains('open')) closeReport();
    else if (authPanel.classList.contains('open')) closeAuth();
  });

  /* ==================================================================
     11. START
     ================================================================== */
  hydrateIcons();
  updateHeader();
  updateLoginButton();
  resetFeed();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { updateMoreButtons(); });
  var resizeRaf = 0;
  window.addEventListener('resize', function () {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(function () { updateMoreButtons(); });
  });
})();
</script>
</body>
</html>
